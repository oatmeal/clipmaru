name: Deploy clip viewer

on:
  schedule:
    - cron: '0 13 * * *'   # every day at 13:00 UTC
  workflow_dispatch:
    inputs:
      mode:
        description: 'Scraping mode'
        required: false
        type: choice
        options: [backfill, fetch, update, skip]
        default: skip

permissions:
    contents: read
    pages: write
    id-token: write

jobs:
  deploy:
    uses: oatmeal/twist-clear/.github/workflows/deploy.yml@master
    with:
      scrape_mode: ${{ github.event.inputs.mode || 'backfill' }}
      backfill_max_calls: 100000  # cap backfill runs to ~3.5 h (well under the 6 h Actions limit)
      streamers: ${{ vars.STREAMERS }}
      site_title: ${{ vars.SITE_TITLE }}
      site_heading: ${{ vars.SITE_HEADING }}
      site_description: ${{ vars.SITE_DESCRIPTION }}
      og_description: ${{ vars.OG_DESCRIPTION }}
      accent_color: ${{ vars.ACCENT_COLOR }}
      cal_accent_color: ${{ vars.CAL_ACCENT_COLOR }}
      color_bg: ${{ vars.COLOR_BG }}
      color_surface: ${{ vars.COLOR_SURFACE }}
      color_surface2: ${{ vars.COLOR_SURFACE2 }}
      color_border: ${{ vars.COLOR_BORDER }}
      color_text: ${{ vars.COLOR_TEXT }}
      color_muted: ${{ vars.COLOR_MUTED }}

    secrets:
      TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
      TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
      TWITCH_WEB_CLIENT_ID: ${{ secrets.TWITCH_WEB_CLIENT_ID }}

  workflow-keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: liskin/gh-workflow-keepalive@f72ff1a1336129f29bf0166c0fd0ca6cf1bcb38c # v1.2.1
